[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medterm-review"
version = "0.1.0"
description = "Review-first medical term span detection and dictionary matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jiwer>=4,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pronouncing>=0.2.0,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.13,<4",
  "streamlit>=1.47,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
phonetics = ["epitran>=1.34,<2", "panphon>=0.22,<1"]
language-id = ["fasttext-wheel>=0.9.2,<1"]
asr = ["faster-whisper>=1.1,<2"]
tts = [
  "kokoro>=0.9.4,<1",
  "misaki[ja,zh]>=0.9.4,<1",
  "soundfile>=0.13,<1",
]
speech-embeddings = [
  "soundfile>=0.13,<1",
  "torch>=2.7,<3",
  "transformers>=4.53,<6",
]
vector-index = ["faiss-cpu>=1.11,<2"]
llm-evaluation = [
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langsmith>=0.3,<1",
  "openai>=1.100,<3",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "playwright>=1.54,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
medterm-build = "medterm.cli:build_command"
medterm-api = "medterm.cli:api_command"
medterm-evaluate = "medterm.cli:evaluate_command"
medterm-audio-index = "medterm.audio_cli:index_command"
medterm-audio-search = "medterm.audio_cli:search_command"
medterm-audio-train = "medterm.audio_cli:train_command"
medterm-tts-build = "medterm.tts_cli:build_command"
medterm-register-source = "medterm.bulk_cli:register_source_command"
medterm-import-terminology = "medterm.bulk_cli:import_terminology_command"
medterm-finalize-dictionary = "medterm.bulk_cli:finalize_dictionary_command"
medterm-vector-batch = "medterm.vector_batch_cli:vector_batch_command"
medterm-finalize-index = "medterm.vector_batch_cli:finalize_index_command"
medterm-medrag-batch = "medterm.medrag_batch_cli:batch_command"

[tool.hatch.build.targets.wheel]
packages = ["src/medterm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"reviewer_app.py" = ["E501"]
"src/medterm/api.py" = ["B008"]
"tests/*" = ["E501"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
